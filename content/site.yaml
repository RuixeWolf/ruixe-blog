# Site-wide identity configuration for Ruixe Blog.
#
# This file is the single source of truth for static, cross-environment site
# identifiers (GitHub username, site title, site description) and is committed
# to Git so a fresh clone works out of the box without any `.env` setup.
#
# `siteUrl` is intentionally NOT defined here - it comes from the
# `NEXT_PUBLIC_SITE_URL` environment variable because preview and production
# deployments may resolve to different URLs.
#
# Edit this file, then restart the dev server (the file is read at module
# evaluation time and is not part of the module graph, so HMR does not apply).

# GitHub login used by the profile card and external links.
githubUsername: RuixeWolf

# Site title shown in the header, mobile drawer, and browser tab metadata.
siteTitle: Ruixe Blog

# Default site description for SEO metadata and Open Graph.
siteDescription: >-
  A personal blog by Ruixe, sharing web development insights and project notes.

# Search-engine site verification tokens, rendered as `<meta>` tags in the
# HTML head. Tokens are public by design (they appear in the page source) and
# safe to commit. Leave fields empty to emit no meta tag.
verification:
  # Google Search Console token (`google-site-verification`).
  # Get token: https://search.google.com/search-console (HTML tag method).
  google: 'VOpGTheQeCFSkxDFE7CjuquNNl6Lqs1xxWcZJOTlkIw'
  # Yahoo Site Explorer token (`y_key`).
  # Get token: https://search.yahoo.com (via Bing Webmasters: https://www.bing.com/webmasters/).
  yahoo: ''
  # Yandex Webmaster token (`yandex-verification`).
  # Get token: https://webmaster.yandex.com
  yandex: ''
  # IndieAuth / ownership token (`me` - for rel="me" verification).
  # Docs: https://indieweb.org/rel-me
  me: ''
  # Bing Webmaster Tools token (`msvalidate.01`).
  # Get token: https://www.bing.com/webmasters/ (HTML meta tag method).
  bing: ''

# VibeCafé (https://vibecafe.ai) product telemetry configuration.
#
# When BOTH the product ID and the web auth key are non-empty, a single
# `<script defer src="https://vibecafe.ai/telemetry/v1.js">` tag is rendered
# in the shared `<head>` of every page (root layout). Clearing either field
# (or the whole block) disables telemetry without any code change.
#
# The auth key is an origin-whitelisted browser integration identifier:
# public by design (it appears in the page source), safe to commit, and
# usable ONLY for browser telemetry - never for management APIs or as a URL
# query parameter. Deployment origins allowed: https://blog.ruixe.net,
# https://ruixe-blog.vercel.app.
vibecafe:
  # VibeCafé product ID (`data-vc-product-id`).
  productId: 'cmt9r3ene00000ajcieiwugc3'
  # Web auth key (`data-vc-auth-key`); browser-only integration identifier.
  authKey: 'vc_web_p7UmlXgLbaQ-Wiu2BYjuWREO8Hz1c868JmEXRe9lyOI'

# Giscus (GitHub Discussions) comments configuration.
#
# Values are generated by https://giscus.app and committed to Git so a fresh
# clone renders comments out of the box without environment variables. The
# `Comments` Discussions category isolates post comments from repo announcements.
# `mapping: pathname` gives each locale's post its own Discussion thread.
giscus:
  # GitHub repository full name (owner/repo) with Discussions enabled.
  repo: RuixeWolf/ruixe-blog
  # Repository ID (base64, generated by giscus.app).
  repoId: R_kgDOTes-7w
  # Discussions category used for post comment threads.
  category: Comments
  # Category ID (base64, generated by giscus.app).
  categoryId: DIC_kwDOTes-784DCN33
  # Path-to-Discussion mapping strategy; `pathname` keeps locales independent.
  mapping: pathname
  # Enable reactions on comments (0 off / 1 on).
  reactionsEnabled: '1'
  # Comment box position relative to the thread (top or bottom).
  inputPosition: top
  # Strict path matching (0 off / 1 on); off tolerates trailing-slash drift.
  strict: '0'
  # Emit Discussion metadata to the page (0 off / 1 on).
  emitMetadata: '0'
